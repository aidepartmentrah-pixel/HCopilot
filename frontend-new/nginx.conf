# frontend-new/nginx.conf — served by frontend-new/Dockerfile
#
# Mirrors frontend/nginx.conf's pattern: same-origin reverse proxy to the
# backend so the built app never has a site-specific backend host/IP baked
# into its JS bundle (see .env.example for the full rationale).

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8090/health;
    }

    # Static built app. try_files falls back to index.html for client-side
    # routing (React Router).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
