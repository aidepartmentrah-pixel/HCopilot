# frontend-new/nginx.conf — served by frontend-new/Dockerfile
#
# Mirrors frontend/nginx.conf's pattern: same-origin reverse proxy to the
# backend so the built app never has a site-specific backend host/IP baked
# into its JS bundle (see .env.example for the full rationale).

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8090/health;
    }

    # Built, hash-named files never change: cache hard. A MISSING file must be a real 404 (not the
    # index.html fallback), otherwise a tab left open across an update gets HTML where it expects
    # JavaScript and shows a blank page.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell points at the current hashed files, so it must never be served from a browser cache.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    # Static built app. try_files falls back to index.html for client-side
    # routing (React Router).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
