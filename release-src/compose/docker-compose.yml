# docker-compose.yml — HCopilot full stack (sqlserver + db-init + backend + frontend + frontend-new)
#
# This is the RELEASE-SIDE deployment definition: version-specific, applied
# to the persistent live deployment at /opt/rah/apps/hcopilot/compose/ during
# install/update (see scripts/install_offline.sh, scripts/update_offline.sh).
# It intentionally has no `build:` sections — production runs only the exact
# images shipped as docker-images/*.tar in this release, never rebuilds.
#
# Explicit stable project identity: `name:` below, not the directory this
# file happens to live in — see RAH Application Release & Deployment
# Standard §3.4.
#
# NOTE ON SHARED SQL SERVER: per RAH Lab policy, one SQL Server instance may
# host multiple project databases. If this hospital's offline server already
# runs a shared SQL Server instance (e.g. for another project), you can point
# DATABASE_SERVER at that instance instead and remove the sqlserver/db-init
# services below — see documentation/INSTALL_OFFLINE.md.

name: hcopilot

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - hcopilot_sqlserver_data:/var/opt/mssql
      # Host-side backup destination — lives under the persistent install
      # directory (../backups relative to this file, i.e.
      # /opt/rah/apps/hcopilot/backups), NOT inside the disposable release
      # folder, so it survives release-folder cleanup and updates.
      - ../backups:/var/opt/mssql/backup
    ports:
      # Exposed for optional GUI access (DBeaver/SSMS/Azure Data Studio) —
      # not required for the app itself, which reaches sqlserver over the
      # internal Compose network.
      - "${DATABASE_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: hcopilot-backend:__APP_VERSION__
    # First install: create the database, create HCopilot's own dedicated
    # SQL Server login (db_owner on its own database only — never the
    # shared sa account, see ensure_login_exists.py and
    # docs/decisions/database-identity-convention.md), build the schema,
    # then transport this hospital's existing lookup/configuration data
    # (real ward layout, bed numbers, staff roster) from the CSVs baked
    # into the image — see backend/scripts/migrate_csv_to_mssql.py.
    # Idempotent: safe to re-run on every container start (skips any
    # table that already has rows, and skips login/database creation if
    # they already exist).
    command: ["sh", "-c", "python scripts/ensure_database_exists.py && python scripts/ensure_login_exists.py && alembic upgrade head && python scripts/migrate_csv_to_mssql.py && python scripts/import_ml_historical_data.py"]
    environment:
      DATABASE_SERVER: sqlserver
      DATABASE_PORT: 1433
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      # HCopilot's own dedicated login password — a real, distinct credential
      # from the sa account, never aliased to MSSQL_SA_PASSWORD.
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # Needed only by ensure_database_exists.py/ensure_login_exists.py,
      # which must connect as sa for their own one-time bootstrap steps.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DATABASE_DRIVER: "ODBC Driver 18 for SQL Server"
      DATABASE_TRUST_SERVER_CERTIFICATE: "yes"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  backend:
    image: hcopilot-backend:__APP_VERSION__
    environment:
      TZ: Asia/Beirut  # hospital local time (Lebanon); all timestamps are wall-clock
      DATABASE_SERVER: sqlserver
      DATABASE_PORT: 1433
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DRIVER: "ODBC Driver 18 for SQL Server"
      DATABASE_TRUST_SERVER_CERTIFICATE: "yes"
      # Fernet key (44 chars) that encrypts/decrypts the Hospital Directory
      # API key stored in the database. Generated by install_offline.sh /
      # update_offline.sh into the persistent .env — never stored in the DB.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      # Optional: ignore this deployment's own arrivals dated BEFORE this day when
      # training the Flow Prediction model and drawing its chart (e.g. to drop a
      # testing period). Nothing is deleted; remove the line to undo. Synthetic
      # history is never affected. Uncomment and set to enable:
      # FLOW_LIVE_DATA_START: "2026-09-22"
    extra_hosts:
      # A container has its own /etc/hosts and does NOT inherit the host's —
      # without this the backend cannot resolve "malin" even when curl on the
      # server can. See HOW_TO_CONNECT_OFFLINE_DOCKER_APP_TO_MALIN.md.
      # Base URL entered in Settings: http://malin:8080/his-general/api/directory/v1
      - "malin:150.50.1.34"
    volumes:
      # Same rationale as ../backups above: lives under the persistent
      # install directory (/opt/rah/apps/hcopilot/models), NOT the
      # disposable release folder, so the live Flow_prediction.pkl and
      # every versioned training run written at runtime by the model
      # training engine survive a release update instead of being reset to
      # whatever was baked into the new image.
      - ../models/AIModels:/app/models/AIModels
    ports:
      - "${BACKEND_PORT:-8090}:8090"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: hcopilot-frontend:__APP_VERSION__
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # New React frontend — runs alongside the old frontend above, same backend,
  # its own port. Additive only: the old `frontend` service is never removed
  # or modified to make room for this one.
  frontend-new:
    image: hcopilot-frontend-new:__APP_VERSION__
    ports:
      - "${FRONTEND_NEW_PORT:-8083}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hcopilot_sqlserver_data:
