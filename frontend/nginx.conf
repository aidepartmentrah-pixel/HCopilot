# frontend/nginx.conf — served by frontend/Dockerfile
#
# Serves the static HCopilot frontend and reverse-proxies API calls to the
# backend container. The frontend JS calls relative paths like "/api/beds/list"
# (see Stage 3 fix to frontend/js/*.js) so from the browser's point of view
# everything is same-origin — nginx is the only origin it ever talks to.

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Reverse-proxy API calls to the backend service (Docker Compose service name)
    location /api/ {
        proxy_pass http://backend:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8090/health;
    }

    # Static frontend files. try_files falls back to index.html so any
    # unmatched path still loads the app shell, mirroring the old
    # StaticFiles(html=True) catch-all behavior.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
